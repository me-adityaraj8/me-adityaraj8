name: snake

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

# both workflows commit to main - queue them so they can never race
concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dahan8473/snake-and-commits@v1
        with:
          github_user: ${{ github.repository_owner }}
          output: snake.svg
          theme: green

      - name: Commit snake.svg
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snake.svg
          git diff --cached --quiet || git commit -m "Update snake [skip ci]"
          git push

name: pet

on:
  schedule:
    - cron: "43 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

# both workflows commit to main - queue them so they can never race
concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  pet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prsdx/YourTomo@v1
        with:
          username: ${{ github.repository_owner }}
          timezone-offset-minutes: "330"
          output-dir: tomo
